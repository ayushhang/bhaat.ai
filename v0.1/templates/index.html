<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhaat.AI - Food Image Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bhaat.AI</h1>
            <p class="subtitle">Upload your food image for recognition</p>
        </header>

        <div class="upload-section">
            <form id="uploadForm" method="POST" action="/upload" enctype="multipart/form-data">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <p class="upload-text">Drag and drop your image here</p>
                    <p class="upload-subtext">or</p>
                    <label for="fileInput" class="upload-button">Browse Files</label>
                    <input type="file" id="fileInput" name="image" accept="image/*" required hidden>
                    <p class="file-types">Supported: JPG, PNG, JPEG</p>
                </div>

                <div class="preview-section" id="previewSection" style="display: none;">
                    <img id="imagePreview" src="" alt="Preview">
                    <div class="preview-actions">
                        <button type="button" class="btn btn-secondary" onclick="resetUpload()">Change Image</button>
                        <button type="submit" class="btn btn-primary">Upload & Analyze</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="resultSection" class="result-section" style="display: none;">
            <h2>Upload Successful!</h2>
            <p id="resultMessage"></p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const imagePreview = document.getElementById('imagePreview');
        const uploadForm = document.getElementById('uploadForm');
        const resultSection = document.getElementById('resultSection');
        const resultMessage = document.getElementById('resultMessage');

        // Handle file input change
        fileInput.addEventListener('change', function(e) {
            handleFile(e.target.files[0]);
        });

        // Handle drag and drop
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                fileInput.files = e.dataTransfer.files;
                handleFile(file);
            }
        });

        function handleFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                uploadArea.style.display = 'none';
                previewSection.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            fileInput.value = '';
            uploadArea.style.display = 'flex';
            previewSection.style.display = 'none';
            resultSection.style.display = 'none';
        }

        // Handle form submission
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(uploadForm);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultMessage.innerHTML = `
                        <strong>File:</strong> ${data.filename}<br>
                        <strong>Stored at:</strong> ${data.filepath}<br>
                        <strong>Size:</strong> ${data.size}
                    `;
                    resultSection.style.display = 'block';
                    uploadArea.style.display = 'none';
                    previewSection.style.display = 'none';
                } else {
                    alert('Upload failed: ' + data.message);
                }
            })
            .catch(error => {
                alert('Upload error: ' + error.message);
            });
        });
    </script>
</body>
</html>
